    <circle cx="850" cy="100" r="6" fill="#6366f1" />
    <circle cx="1030" cy="150" r="6" fill="#6366f1" />
    <circle cx="810" cy="265" r="8" fill="#6366f1" />
    <circle cx="940" cy="295" r="8" fill="#6366f1" />
    <circle cx="1000" cy="440" r="8" fill="#6366f1" />
