    <line x1="660" y1="140" x2="1140" y2="140" />
    <line x1="660" y1="170" x2="1140" y2="170" />
    <line x1="660" y1="200" x2="1140" y2="200" />
    <line x1="660" y1="230" x2="1140" y2="230" />
    <line x1="660" y1="260" x2="1140" y2="260" />
    <line x1="660" y1="290" x2="1140" y2="290" />
