  <!-- Typographic Anchor -->
  <rect x="60" y="330" width="3" height="180" fill="#6366f1" />

  <!-- Category Label -->
  <text x="60" y="80" font-family="'DM Mono', monospace" font-size="16" fill="#64748b" style="text-transform: uppercase; letter-spacing: 0.1em;">Operations</text>

  <!-- Title Text -->
  <text x="60" y="420" font-family="'Sora', sans-serif" font-size="72" font-weight="700" fill="#1A1916">
    <tspan x="60" dy="0">The Visibility <tspan fill="#6366f1">Gap</tspan></tspan>
    <tspan x="60" dy="85">Insight vs. Dashboards</tspan>
  </text>
</svg>
