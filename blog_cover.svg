    <circle cx="1000" cy="250" r="20" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="1000" cy="250" r="30" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1" />

    <!-- Focal Node 3 -->
    <circle cx="900" cy="450" r="8" />
    <circle cx="900" cy="450" r="16" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="900" cy="450" r="24" fill="none" stroke="#6366f1" stroke-opacity="0.15" stroke-width="1" />

