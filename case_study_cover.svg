  <!-- Background Grid - 60+ elements -->
  <g stroke="#1A1916" stroke-opacity="0.08" stroke-width="1">
    <!-- Vertical -->
    <line x1="600" y1="50" x2="600" y2="580" /><line x1="630" y1="50" x2="630" y2="580" /><line x1="660" y1="50" x2="660" y2="580" /><line x1="690" y1="50" x2="690" y2="580" /><line x1="720" y1="50" x2="720" y2="580" /><line x1="750" y1="50" x2="750" y2="580" /><line x1="780" y1="50" x2="780" y2="580" /><line x1="810" y1="50" x2="810" y2="580" /><line x1="840" y1="50" x2="840" y2="580" /><line x1="870" y1="50" x2="870" y2="580" /><line x1="900" y1="50" x2="900" y2="580" /><line x1="930" y1="50" x2="930" y2="580" /><line x1="960" y1="50" x2="960" y2="580" /><line x1="990" y1="50" x2="990" y2="580" /><line x1="1020" y1="50" x2="1020" y2="580" /><line x1="1050" y1="50" x2="1050" y2="580" /><line x1="1080" y1="50" x2="1080" y2="580" /><line x1="1110" y1="50" x2="1110" y2="580" /><line x1="1140" y1="50" x2="1140" y2="580" /><line x1="1170" y1="50" x2="1170" y2="580" />
    <!-- Horizontal -->
    <line x1="600" y1="50" x2="1170" y2="50" /><line x1="600" y1="80" x2="1170" y2="80" /><line x1="600" y1="110" x2="1170" y2="110" /><line x1="600" y1="140" x2="1170" y2="140" /><line x1="600" y1="170" x2="1170" y2="170" /><line x1="600" y1="200" x2="1170" y2="200" /><line x1="600" y1="230" x2="1170" y2="230" /><line x1="600" y1="260" x2="1170" y2="260" /><line x1="600" y1="290" x2="1170" y2="290" /><line x1="600" y1="320" x2="1170" y2="320" /><line x1="600" y1="350" x2="1170" y2="350" /><line x1="600" y1="380" x2="1170" y2="380" /><line x1="600" y1="410" x2="1170" y2="410" /><line x1="600" y1="440" x2="1170" y2="440" /><line x1="600" y1="470" x2="1170" y2="470" /><line x1="600" y1="500" x2="1170" y2="500" /><line x1="600" y1="530" x2="1170" y2="530" /><line x1="600" y1="560" x2="1170" y2="560" /><line x1="600" y1="590" x2="1170" y2="590" />
  </g>

  <!-- Mid-ground Hub and Spoke (Opacity 0.4-0.6) - 20 elements -->
  <g stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.5">
    <!-- Center Hub -->
    <circle cx="885" cy="315" r="40" fill="none" />
    <circle cx="885" cy="315" r="60" fill="none" stroke-opacity="0.3" />
    <!-- Spokes -->
    <line x1="885" y1="275" x2="885" y2="150" />
    <line x1="885" y1="355" x2="885" y2="480" />
    <line x1="925" y1="315" x2="1080" y2="315" />
    <line x1="845" y1="315" x2="690" y2="315" />
    <line x1="913" y1="287" x2="1020" y2="180" />
    <line x1="857" y1="343" x2="750" y2="450" />
    <line x1="913" y1="343" x2="1020" y2="450" />
    <line x1="857" y1="287" x2="750" y2="180" />
  </g>

  <!-- Foreground Elements (Opacity 1.0) - 20 elements -->
  <g fill="#6366f1">
    <!-- Focal Points at Spoke Ends -->
    <circle cx="885" cy="150" r="10" /><circle cx="885" cy="150" r="20" fill="none" stroke="#6366f1" stroke-opacity="0.3" />
    <circle cx="885" cy="480" r="10" /><circle cx="885" cy="480" r="20" fill="none" stroke="#6366f1" stroke-opacity="0.3" />
    <circle cx="1080" cy="315" r="10" /><circle cx="1080" cy="315" r="20" fill="none" stroke="#6366f1" stroke-opacity="0.3" />
    <circle cx="690" cy="315" r="10" /><circle cx="690" cy="315" r="20" fill="none" stroke="#6366f1" stroke-opacity="0.3" />

    <!-- Central Focal Node -->
    <circle cx="885" cy="315" r="15" />

    <!-- Secondary Spoke Nodes -->
    <circle cx="1020" cy="180" r="6" fill-opacity="0.7" />
    <circle cx="750" cy="450" r="6" fill-opacity="0.7" />
    <circle cx="1020" cy="450" r="6" fill-opacity="0.7" />
    <circle cx="750" cy="180" r="6" fill-opacity="0.7" />
  </g>

  <!-- Typographic Anchor -->
  <rect x="60" y="330" width="3" height="180" fill="#6366f1" />

  <!-- Category Label -->
  <text x="60" y="80" font-family="'DM Mono', monospace" font-size="16" fill="#64748b" style="text-transform: uppercase; letter-spacing: 0.1em;">Case Study</text>

  <!-- Title Text -->
  <text x="60" y="420" font-family="'Sora', sans-serif" font-size="72" font-weight="700" fill="#1A1916">
    <tspan x="60" dy="0">Project <tspan fill="#6366f1">ClearSight</tspan></tspan>
    <tspan x="60" dy="85">Supply Chain Visibility</tspan>
  </text>
</svg>
